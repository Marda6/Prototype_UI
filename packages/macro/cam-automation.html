  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      typeof nextState !== &quot;object&quot; ||

    }

    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    globalThis.openai = {

      openExternal,
      sendFollowUpMessage,

    };
    globalThis.dispatchEvent(

      }),

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

    }

  #cam-automation {

            &lt;div&gt;&lt;label class=&quot;ca-label&quot; for=&quot;ca-collision&quot;&gt;Если результаты уже существуют&lt;/label&gt;&lt;select class=&quot;ca-select&quot; id=&quot;ca-collision&quot;&gt;&lt;option value=&quot;version&quot;&gt;Добавить номер версии&lt;/option&gt;&lt;option value=&quot;skip&quot;&gt;Пропустить модель&lt;/option&gt;&lt;option value=&quot;replace&quot;&gt;Перезаписать результаты&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
            &lt;div&gt;&lt;label class=&quot;ca-label&quot; for=&quot;ca-error-policy&quot;&gt;При ошибке в модели&lt;/label&gt;&lt;select class=&quot;ca-select&quot; id=&quot;ca-error-policy&quot;&gt;&lt;option value=&quot;continue&quot;&gt;Перейти к следующей&lt;/option&gt;&lt;option value=&quot;stop&quot;&gt;Остановить пакет&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;

        &lt;div id=&quot;ca-batch-error&quot; class=&quot;ca-notice ca-notice-danger&quot; role=&quot;alert&quot; hidden&gt;&lt;/div&gt;

      &lt;/footer&gt;
    &lt;/section&gt;
    &lt;section id=&quot;ca-panel-run&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ca-tab-run&quot; hidden&gt;
      &lt;div class=&quot;ca-body&quot;&gt;
        &lt;div class=&quot;ca-row ca-between&quot;&gt;&lt;span class=&quot;ca-run-summary&quot; id=&quot;ca-run-title&quot;&gt;Выполнение&lt;/span&gt;&lt;span class=&quot;ca-pill&quot; id=&quot;ca-run-mode&quot;&gt;Пакет&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ca-progress&quot; role=&quot;progressbar&quot; aria-label=&quot;Обработка моделей&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot; aria-valuenow=&quot;0&quot; id=&quot;ca-progress&quot;&gt;&lt;div class=&quot;ca-progress-fill&quot; id=&quot;ca-progress-fill&quot;&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;ca-row ca-between ca-small ca-muted&quot;&gt;&lt;span id=&quot;ca-run-caption&quot; role=&quot;status&quot;&gt;&lt;/span&gt;&lt;span id=&quot;ca-run-counter&quot;&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ca-queue&quot;&gt;&lt;div class=&quot;ca-queue-head&quot;&gt;МОДЕЛЬ И РЕЗУЛЬТАТ&lt;/div&gt;&lt;div id=&quot;ca-queue-rows&quot;&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div id=&quot;ca-run-error&quot; class=&quot;ca-notice ca-notice-warn&quot; hidden&gt;&lt;/div&gt;
        &lt;details class=&quot;ca-log&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Журнал выполнения&lt;/summary&gt;&lt;div id=&quot;ca-log-content&quot;&gt;&lt;/div&gt;&lt;/details&gt;
        &lt;div class=&quot;ca-status&quot;&gt;Демонстрация: расчёт и сохранение файлов имитируются.&lt;/div&gt;
      &lt;/div&gt;
      &lt;footer class=&quot;ca-foot&quot;&gt;
        &lt;button class=&quot;ca-button cursor-interaction&quot; type=&quot;button&quot; id=&quot;ca-to-settings&quot;&gt;К настройкам&lt;/button&gt;
        &lt;div class=&quot;ca-row&quot;&gt;
          &lt;button class=&quot;ca-button ca-link cursor-interaction&quot; type=&quot;button&quot; id=&quot;ca-inject-error&quot;&gt;Смоделировать ошибку&lt;/button&gt;
          &lt;button class=&quot;ca-button cursor-interaction&quot; type=&quot;button&quot; id=&quot;ca-pause&quot;&gt;&lt;i data-lucide=&quot;pause&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span id=&quot;ca-pause-label&quot;&gt;Пауза&lt;/span&gt;&lt;/button&gt;
          &lt;button class=&quot;ca-button cursor-interaction&quot; type=&quot;button&quot; id=&quot;ca-stop&quot;&gt;&lt;i data-lucide=&quot;square&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Остановить&lt;/button&gt;
          &lt;button class=&quot;ca-button ca-primary cursor-interaction&quot; type=&quot;button&quot; id=&quot;ca-retry&quot; hidden&gt;Повторить ошибки&lt;/button&gt;
        &lt;/div&gt;
      &lt;/footer&gt;
    &lt;/section&gt;
  &lt;/section&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;cam-automation&#x27;);
  const q = (id) =&gt; root.querySelector(&#x27;#ca-&#x27; + id);
  const esc = (s) =&gt; String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const icon = (name) =&gt; &#x27;&lt;i data-lucide=&quot;&#x27; + name + &#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;;
  const icons = () =&gt; { if (globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:16,height:16}}); };
  const defs = {
    new: {label:&#x27;Создать новый проект&#x27;, icon:&#x27;file-plus-2&#x27;, sub:&#x27;Чистый проект · мм&#x27;},
    import: {label:&#x27;Импортировать 3D-модель&#x27;, icon:&#x27;import&#x27;, sub:&#x27;Текущий файл из папки&#x27;},
    operations: {label:&#x27;Создать операции&#x27;, icon:&#x27;layers-2&#x27;, sub:&#x27;Черновая + чистовая&#x27;},
    calculate: {label:&#x27;Рассчитать операции&#x27;, icon:&#x27;calculator&#x27;, sub:&#x27;Все операции проекта&#x27;},
    export: {label:&#x27;Вывести УП&#x27;, icon:&#x27;file-output&#x27;, sub:&#x27;Постпроцессор из макроса&#x27;},
    save: {label:&#x27;Сохранить проект&#x27;, icon:&#x27;save&#x27;, sub:&#x27;Папка результата&#x27;}
  };
  const sequence = Object.keys(defs);
  let steps = sequence.slice(), selectedStep = 1, recording = false, recordPaused = false;
  let modelSource = &#x27;current&#x27;, units = &#x27;mm&#x27;, macroRevision = 1;
  const savedMacros = new Map();
  let savedName = q(&#x27;macro-name&#x27;).value;
  savedMacros.set(savedName, {steps:steps.slice(), modelSource, units});
  let group = &#x27;housings&#x27;, excluded = new Set(), run = null, timer = null;
  const existing = new Set();
  const data = {
    housings: [
      {id:&#x27;h1&#x27;,name:&#x27;Корпус_01.step&#x27;,size:&#x27;2,4 МБ&#x27;,type:&#x27;step&#x27;,sub:false},
      {id:&#x27;h2&#x27;,name:&#x27;Корпус_02.step&#x27;,size:&#x27;3,1 МБ&#x27;,type:&#x27;step&#x27;,sub:false},
      {id:&#x27;h3&#x27;,name:&#x27;Корпус_03.iges&#x27;,size:&#x27;1,8 МБ&#x27;,type:&#x27;iges&#x27;,sub:false},
      {id:&#x27;h4&#x27;,name:&#x27;Варианты/Корпус_04.step&#x27;,size:&#x27;2,7 МБ&#x27;,type:&#x27;step&#x27;,sub:true}
    ],
    covers: [
      {id:&#x27;c1&#x27;,name:&#x27;Крышка_01.step&#x27;,size:&#x27;1,2 МБ&#x27;,type:&#x27;step&#x27;,sub:false},
      {id:&#x27;c2&#x27;,name:&#x27;Крышка_02.step&#x27;,size:&#x27;1,5 МБ&#x27;,type:&#x27;step&#x27;,sub:false}
    ]
  };
  const visibleFiles = () =&gt; data[group].filter(f =&gt; (!f.sub || q(&#x27;recursive&#x27;).checked) &amp;&amp; (q(&#x27;format&#x27;).value === &#x27;all&#x27; || q(&#x27;format&#x27;).value === f.type));
  const chosenFiles = () =&gt; visibleFiles().filter(f =&gt; !excluded.has(f.id));
  const stem = (f) =&gt; f.name.split(&#x27;/&#x27;).pop().replace(/\.[^.]+$/, &#x27;&#x27;);
  const isActive = () =&gt; run &amp;&amp; [&#x27;running&#x27;,&#x27;paused&#x27;,&#x27;pausing&#x27;,&#x27;stopping&#x27;].includes(run.status);
  const validation = () =&gt; {
    if (!q(&#x27;macro-name&#x27;).value.trim()) return &#x27;Укажите название макроса.&#x27;;
    if (recording) return &#x27;Завершите запись макроса перед запуском.&#x27;;
    if (sequence.some(type =&gt; !steps.includes(type))) return &#x27;Для пакетной обработки нужны все 6 базовых команд.&#x27;;
    if (steps[0] !== &#x27;new&#x27;) return &#x27;Первым шагом должен быть «Создать новый проект».&#x27;;
    if (steps.filter(t=&gt;t===&#x27;new&#x27;).length !== 1 || steps.filter(t=&gt;t===&#x27;import&#x27;).length !== 1) return &#x27;Оставьте один новый проект и один импорт модели на проход.&#x27;;
    const rank = {new:0,import:1,operations:2,calculate:3,export:4,save:5};
    if (steps.some((t,i) =&gt; i &amp;&amp; rank[t] &lt; rank[steps[i-1]])) return &#x27;Проверьте порядок: проект → импорт → операции → расчёт → УП → сохранение.&#x27;;
    if (modelSource !== &#x27;current&#x27;) return &#x27;В импорте выберите «Текущий файл из папки», чтобы обработать каждую модель.&#x27;;
    return &#x27;&#x27;;
  };
  function view(name) {
    root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(b =&gt; b.setAttribute(&#x27;aria-selected&#x27;, String(b.dataset.view === name)));
    [&#x27;macro&#x27;,&#x27;batch&#x27;,&#x27;run&#x27;].forEach(n =&gt; { q(&#x27;panel-&#x27; + n).hidden = name !== n; });
    if (name === &#x27;batch&#x27;) refreshBatch();
  }
  function renderSteps() {
    q(&#x27;commands&#x27;).innerHTML = steps.length ? steps.map((type,i) =&gt;
      &#x27;&lt;button type=&quot;button&quot; class=&quot;ca-command cursor-interaction&quot; data-step=&quot;&#x27; + i + &#x27;&quot; aria-pressed=&quot;&#x27; + (i===selectedStep) + &#x27;&quot;&gt;&lt;span class=&quot;ca-command-num&quot;&gt;&#x27; + String(i+1).padStart(2,&#x27;0&#x27;) + &#x27;&lt;/span&gt;&#x27; + icon(defs[type].icon) + &#x27;&lt;span class=&quot;ca-command-label&quot;&gt;&#x27; + defs[type].label + &#x27;&lt;span class=&quot;ca-command-sub&quot;&gt;&#x27; + (type===&#x27;import&#x27;&amp;&amp;modelSource===&#x27;recorded&#x27;?&#x27;Файл записанного сеанса&#x27;:defs[type].sub) + &#x27;&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;&#x27;
    ).join(&#x27;&#x27;) : &#x27;&lt;div class=&quot;ca-empty&quot;&gt;Начните запись или добавьте команду.&lt;/div&gt;&#x27;;
    q(&#x27;step-count&#x27;).textContent = &#x27;Шагов: &#x27; + steps.length;
    q(&#x27;up&#x27;).disabled = selectedStep &lt;= 0 || !steps.length || recording;
    q(&#x27;down&#x27;).disabled = selectedStep &gt;= steps.length-1 || !steps.length || recording;
    q(&#x27;delete&#x27;).disabled = !steps.length || recording;
    q(&#x27;macro-valid&#x27;).textContent = validation() || &#x27;Готов к пакетному запуску&#x27;;
    q(&#x27;macro-valid&#x27;).style.color = validation() ? &#x27;var(--ca-warn)&#x27; : &#x27;var(--ca-ok)&#x27;;
    renderInspector(); icons();
  }
  function renderInspector() {
    const type = steps[selectedStep], box = q(&#x27;inspector&#x27;);
    if (!type) { box.innerHTML = &#x27;&lt;span class=&quot;ca-muted&quot;&gt;Параметры выбранной команды&lt;/span&gt;&#x27;; return; }
    let html = &#x27;&lt;h3&gt;&#x27; + defs[type].label + &#x27;&lt;/h3&gt;&#x27;;
    if (type === &#x27;new&#x27;) html += &#x27;&lt;div class=&quot;ca-field&quot;&gt;&lt;span class=&quot;ca-label&quot;&gt;Имя проекта&lt;/span&gt;&lt;span class=&quot;ca-token&quot;&gt;Имя текущей модели&lt;/span&gt;&lt;/div&gt;&lt;label class=&quot;ca-label&quot; for=&quot;ca-units&quot;&gt;Единицы&lt;/label&gt;&lt;select class=&quot;ca-select&quot; id=&quot;ca-units&quot;&gt;&lt;option value=&quot;mm&quot;&gt;Миллиметры&lt;/option&gt;&lt;option value=&quot;inch&quot;&gt;Дюймы&lt;/option&gt;&lt;/select&gt;&lt;p class=&quot;ca-help&quot;&gt;Отдельный чистый проект для каждой модели.&lt;/p&gt;&#x27;;
    if (type === &#x27;import&#x27;) html += &#x27;&lt;label class=&quot;ca-label&quot; for=&quot;ca-model-source&quot;&gt;Источник 3D-модели&lt;/label&gt;&lt;select class=&quot;ca-select&quot; id=&quot;ca-model-source&quot;&gt;&lt;option value=&quot;current&quot;&gt;Текущий файл из папки&lt;/option&gt;&lt;option value=&quot;recorded&quot;&gt;Файл записанного сеанса&lt;/option&gt;&lt;/select&gt;&lt;p class=&quot;ca-help&quot;&gt;Файл подставляется для каждого прохода макроса.&lt;/p&gt;&lt;div class=&quot;ca-field&quot; style=&quot;margin-top:20px&quot;&gt;&lt;span class=&quot;ca-label&quot;&gt;Пример подстановки&lt;/span&gt;&lt;span class=&quot;ca-token&quot;&gt;Текущая модель&lt;/span&gt;&lt;div class=&quot;ca-preview-line&quot;&gt;&#x27; + icon(&#x27;file-box&#x27;) + &#x27;Корпус_01.step&lt;/div&gt;&lt;/div&gt;&#x27;;
    if (type === &#x27;operations&#x27;) html += &#x27;&lt;span class=&quot;ca-label&quot;&gt;Записанная технология&lt;/span&gt;&lt;div class=&quot;ca-preview-line&quot;&gt;&#x27; + icon(&#x27;layers-2&#x27;) + &#x27;&lt;span&gt;Черновая выборка&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ca-preview-line&quot;&gt;&#x27; + icon(&#x27;layers-2&#x27;) + &#x27;&lt;span&gt;Чистовая обработка&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;ca-help&quot;&gt;Параметры операций, инструменты, заготовка и система координат хранятся в макросе.&lt;/p&gt;&lt;div class=&quot;ca-field&quot; style=&quot;margin-top:20px&quot;&gt;&lt;span class=&quot;ca-label&quot;&gt;Геометрия операций&lt;/span&gt;&lt;span class=&quot;ca-token&quot;&gt;Импортированная модель&lt;/span&gt;&lt;/div&gt;&#x27;;
    if (type === &#x27;calculate&#x27;) html += &#x27;&lt;span class=&quot;ca-label&quot;&gt;Область расчёта&lt;/span&gt;&lt;div&gt;Все операции текущего проекта&lt;/div&gt;&lt;div class=&quot;ca-preview-line&quot; style=&quot;margin-top:16px&quot;&gt;&#x27; + icon(&#x27;clock-3&#x27;) + &#x27;&lt;span&gt;Дождаться завершения всех расчётов&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;ca-help&quot;&gt;При ошибке расчёта вывод УП для этой модели пропускается.&lt;/p&gt;&#x27;;
    if (type === &#x27;export&#x27;) html += &#x27;&lt;div class=&quot;ca-field&quot;&gt;&lt;span class=&quot;ca-label&quot;&gt;Постпроцессор&lt;/span&gt;&lt;div&gt;Из записанной технологии&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ca-field&quot;&gt;&lt;span class=&quot;ca-label&quot;&gt;Папка&lt;/span&gt;&lt;span class=&quot;ca-token&quot;&gt;Папка результата модели&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;ca-label&quot;&gt;Имя файла УП&lt;/span&gt;&lt;span class=&quot;ca-token&quot;&gt;Имя модели&lt;/span&gt;&lt;span&gt;.nc&lt;/span&gt;&lt;p class=&quot;ca-help&quot;&gt;Одна УП со всеми рассчитанными операциями.&lt;/p&gt;&#x27;;
    if (type === &#x27;save&#x27;) html += &#x27;&lt;div class=&quot;ca-field&quot;&gt;&lt;span class=&quot;ca-label&quot;&gt;Папка&lt;/span&gt;&lt;span class=&quot;ca-token&quot;&gt;Папка результата модели&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ca-field&quot;&gt;&lt;span class=&quot;ca-label&quot;&gt;Имя проекта&lt;/span&gt;&lt;span class=&quot;ca-token&quot;&gt;Имя модели&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;ca-help&quot;&gt;Сохранить геометрию, операции и рассчитанные траектории в формате CAM.&lt;/p&gt;&#x27;;
    box.innerHTML = html;
    if (q(&#x27;units&#x27;)) { q(&#x27;units&#x27;).value=units; q(&#x27;units&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{units=e.target.value; macroRevision++;}); }
    if (q(&#x27;model-source&#x27;)) { q(&#x27;model-source&#x27;).value=modelSource; q(&#x27;model-source&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{modelSource=e.target.value; macroRevision++; renderSteps();}); }
  }
  function updateRecording() {
    q(&#x27;record&#x27;).hidden=recording; q(&#x27;record-pause&#x27;).hidden=!recording; q(&#x27;record-stop&#x27;).hidden=!recording;
    q(&#x27;recording-notice&#x27;).hidden=!recording; q(&#x27;new&#x27;).disabled=recording; q(&#x27;add&#x27;).disabled=recording; q(&#x27;save-macro&#x27;).disabled=recording; q(&#x27;saved-macros&#x27;).disabled=recording;
    q(&#x27;recording-text&#x27;).textContent = recordPaused ? &#x27;Запись на паузе&#x27; : &#x27;Идёт запись · &#x27; + steps.length + &#x27; шагов&#x27;;
    q(&#x27;demo-command&#x27;).disabled = recordPaused;
    q(&#x27;record-pause&#x27;).setAttribute(&#x27;aria-label&#x27;,recordPaused ? &#x27;Продолжить запись&#x27; : &#x27;Пауза записи&#x27;);
    q(&#x27;record-pause&#x27;).innerHTML=icon(recordPaused?&#x27;play&#x27;:&#x27;pause&#x27;); renderSteps();
  }
  function refreshBatch() {
    q(&#x27;batch-macro-name&#x27;).textContent=q(&#x27;macro-name&#x27;).value || &#x27;Без названия&#x27;;
    const files=visibleFiles(), chosen=chosenFiles();
    q(&#x27;files&#x27;).innerHTML=files.length ? files.map(f=&gt;&#x27;&lt;div class=&quot;ca-file&quot;&gt;&lt;label class=&quot;cursor-interaction&quot;&gt;&lt;input type=&quot;checkbox&quot; data-file=&quot;&#x27; + f.id + &#x27;&quot; &#x27; + (!excluded.has(f.id)?&#x27;checked&#x27;:&#x27;&#x27;) + &#x27;&gt;&#x27; + icon(&#x27;file-box&#x27;) + &#x27;&lt;span&gt;&#x27; + esc(f.name) + &#x27;&lt;/span&gt;&lt;/label&gt;&lt;span class=&quot;ca-file-size&quot;&gt;&#x27; + f.size + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;) : &#x27;&lt;div class=&quot;ca-empty&quot;&gt;Нет моделей выбранного формата.&lt;/div&gt;&#x27;;
    q(&#x27;file-count&#x27;).textContent=&#x27;Выбрано &#x27; + chosen.length + &#x27; из &#x27; + files.length;
    updatePreview(); icons();
  }
  function updatePreview() {
    const chosen=chosenFiles(), name=chosen.length ? stem(chosen[0]) : &#x27;Имя_модели&#x27;;
    const dest=q(&#x27;output&#x27;).value.trim().replace(/\/+$/,&#x27;&#x27;);
    q(&#x27;preview-path&#x27;).textContent=(dest || &#x27;Папка результатов&#x27;) + &#x27;/&#x27; + (q(&#x27;per-model&#x27;).checked?name+&#x27;/&#x27;:&#x27;&#x27;);
    q(&#x27;preview-project&#x27;).textContent=name+&#x27; · проект CAM&#x27;;
    q(&#x27;preview-nc&#x27;).textContent=name+&#x27;.nc&#x27;;
    q(&#x27;batch-summary&#x27;).textContent=&#x27;Моделей: &#x27; + chosen.length + &#x27; · проект + УП для каждой&#x27;;
